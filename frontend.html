<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Plagiarism Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #e4e4e7;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #a1a1aa;
            margin-bottom: 2rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #313244;
            padding-bottom: 0.5rem;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            font-size: 0.95rem;
            border-radius: 6px 6px 0 0;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #e4e4e7;
            background: #313244;
        }

        .tab.active {
            color: #60a5fa;
            background: #313244;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Forms and inputs */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #cdd6f4;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            background: #11111b;
            border: 1px solid #313244;
            border-radius: 6px;
            color: #cdd6f4;
            font-size: 1rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Panels */
        .panel {
            background: #1e1e2e;
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #313244;
            margin-bottom: 1.5rem;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #313244;
        }

        .panel-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #11111b;
            border: 1px solid #313244;
            border-radius: 8px;
            padding: 1rem;
            color: #cdd6f4;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #60a5fa;
        }

        /* Buttons */
        .button-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .primary-btn {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: white;
        }

        .primary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(96, 165, 250, 0.4);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: #313244;
            color: #cdd6f4;
        }

        .secondary-btn:hover {
            background: #45475a;
        }

        .danger-btn {
            background: #f87171;
            color: white;
        }

        /* Results */
        .results {
            background: #1e1e2e;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #313244;
        }

        .score-display {
            text-align: center;
            padding: 2rem;
            border-bottom: 1px solid #313244;
            margin-bottom: 1.5rem;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            font-weight: 700;
        }

        .score-critical { background: linear-gradient(135deg, #dc2626, #f87171); }
        .score-high { background: linear-gradient(135deg, #ea580c, #fb923c); }
        .score-medium { background: linear-gradient(135deg, #ca8a04, #facc15); color: #1e1e2e; }
        .score-low { background: linear-gradient(135deg, #16a34a, #4ade80); color: #1e1e2e; }
        .score-none { background: linear-gradient(135deg, #0d9488, #2dd4bf); color: #1e1e2e; }

        .verdict {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Match table */
        .match-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .match-table th, .match-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #313244;
        }

        .match-table th {
            background: #11111b;
            color: #a1a1aa;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .match-table tr:hover {
            background: #313244;
        }

        .score-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .badge-critical { background: #f87171; color: #1e1e2e; }
        .badge-high { background: #fb923c; color: #1e1e2e; }
        .badge-medium { background: #facc15; color: #1e1e2e; }
        .badge-low { background: #4ade80; color: #1e1e2e; }

        /* Tags list */
        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag-item {
            background: #313244;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-item:hover {
            background: #45475a;
        }

        .tag-count {
            background: #60a5fa;
            color: #1e1e2e;
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Loading & messages */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 2rem;
            color: #a1a1aa;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #313244;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-msg {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .error-msg {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid #f87171;
            color: #fca5a5;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .info-box {
            background: #11111b;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .info-box h4 {
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }

        /* Two column compare */
        .code-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .code-panels {
                grid-template-columns: 1fr;
            }
        }

        .panel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-pink { background: #f472b6; }
        .dot-green { background: #34d399; }

        /* Diff view */
        .diff-view {
            background: #11111b;
            padding: 1rem;
            margin: 0;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre;
            max-height: 400px;
            overflow-y: auto;
        }

        .diff-add { color: #a6e3a1; background: rgba(166, 227, 161, 0.1); display: block; }
        .diff-remove { color: #f38ba8; background: rgba(243, 139, 168, 0.1); display: block; }
        .diff-context { color: #6c7086; }

        .detail-section {
            background: #11111b;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .detail-section h3 {
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Code Plagiarism Checker</h1>
        <p class="subtitle">Compare code samples or check against a database of submissions</p>

        <div class="tabs">
            <button class="tab active" onclick="showTab('compare')">Quick Compare</button>
            <button class="tab" onclick="showTab('submit')">Submit Code</button>
            <button class="tab" onclick="showTab('check')">Check Against Tag</button>
            <button class="tab" onclick="showTab('batch')">Batch Analysis</button>
            <button class="tab" onclick="showTab('manage')">Manage Tags</button>
        </div>

        <!-- Quick Compare Tab -->
        <div id="compare-tab" class="tab-content active">
            <div class="code-panels">
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-dot dot-pink"></div>
                        <span class="panel-title">Code Sample 1</span>
                    </div>
                    <textarea id="code1" placeholder="Paste first code sample here..."></textarea>
                </div>
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-dot dot-green"></div>
                        <span class="panel-title">Code Sample 2</span>
                    </div>
                    <textarea id="code2" placeholder="Paste second code sample here..."></textarea>
                </div>
            </div>
            <div class="button-row">
                <button class="primary-btn" onclick="quickCompare()">Compare</button>
                <button class="secondary-btn" onclick="clearCompare()">Clear</button>
            </div>
            <div id="compare-results"></div>
        </div>

        <!-- Submit Code Tab -->
        <div id="submit-tab" class="tab-content">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Submit Code to Database</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tag (e.g., cse330-hw5)</label>
                        <input type="text" id="submit-tag" placeholder="cse330-hw5">
                    </div>
                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" id="submit-student" placeholder="1234567890">
                    </div>
                    <div class="form-group">
                        <label>Filename</label>
                        <input type="text" id="submit-filename" placeholder="main.cpp">
                    </div>
                </div>
                <div class="form-group">
                    <label>Code</label>
                    <textarea id="submit-code" placeholder="Paste code here..."></textarea>
                </div>
            </div>
            <div class="button-row">
                <button class="primary-btn" onclick="submitCode()">Submit</button>
            </div>
            <div id="submit-results"></div>
        </div>

        <!-- Check Against Tag Tab -->
        <div id="check-tab" class="tab-content">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Check Code Against All Submissions with Tag</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tag</label>
                        <input type="text" id="check-tag" placeholder="cse330-hw5">
                    </div>
                    <div class="form-group">
                        <label>Student ID (optional, excludes self)</label>
                        <input type="text" id="check-student" placeholder="1234567890">
                    </div>
                    <div class="form-group">
                        <label>Threshold (%)</label>
                        <input type="text" id="check-threshold" value="40">
                    </div>
                </div>
                <div class="form-group">
                    <label>Code to Check</label>
                    <textarea id="check-code" placeholder="Paste code here..."></textarea>
                </div>
            </div>
            <div class="button-row">
                <button class="primary-btn" onclick="checkAgainstTag()">Check</button>
            </div>
            <div id="check-results"></div>
        </div>

        <!-- Batch Analysis Tab -->
        <div id="batch-tab" class="tab-content">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Compare All Submissions with a Tag</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tag</label>
                        <input type="text" id="batch-tag" placeholder="cse330-hw5">
                    </div>
                    <div class="form-group">
                        <label>Threshold (%)</label>
                        <input type="text" id="batch-threshold" value="40">
                    </div>
                    <div class="form-group"></div>
                </div>
            </div>
            <div class="button-row">
                <button class="primary-btn" onclick="batchAnalysis()">Analyze All Pairs</button>
            </div>
            <div id="batch-results"></div>
        </div>

        <!-- Manage Tags Tab -->
        <div id="manage-tab" class="tab-content">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">All Tags</span>
                </div>
                <div id="tags-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>Loading tags...</span>
                    </div>
                </div>
            </div>
            <div id="submissions-container"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            if (tabName === 'manage') {
                loadTags();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getBadgeClass(level) {
            return {
                'critical': 'badge-critical',
                'high': 'badge-high',
                'medium': 'badge-medium',
                'low': 'badge-low',
                'none': 'badge-low'
            }[level] || 'badge-low';
        }

        // Quick Compare
        async function quickCompare() {
            const code1 = document.getElementById('code1').value.trim();
            const code2 = document.getElementById('code2').value.trim();
            const resultsDiv = document.getElementById('compare-results');

            if (!code1 || !code2) {
                resultsDiv.innerHTML = '<div class="error-msg">Please paste code in both text boxes</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><span>Comparing...</span></div>';

            try {
                const response = await fetch(`${API_URL}/api/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code1, code2 })
                });

                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error-msg">${data.error}</div>`;
                    return;
                }

                resultsDiv.innerHTML = `
                    <div class="results">
                        <div class="score-display">
                            <div class="score-circle score-${data.verdict.level}">${data.score}%</div>
                            <div class="verdict">${data.verdict.text}</div>
                            <p style="color: #a1a1aa; margin-top: 0.5rem;">${data.verdict.description}</p>
                        </div>

                        ${data.suspicious && data.suspicious.identical_strings.length > 0 ? `
                            <div class="detail-section" style="background: rgba(248,113,113,0.1); border: 1px solid #f87171;">
                                <h3 style="color: #f87171;">🚨 Suspicious: ${data.suspicious.string_count} identical strings found</h3>
                                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                                    ${data.suspicious.identical_strings.map(s => `<code style="background:#313244;padding:0.25rem 0.5rem;border-radius:4px;font-size:11px;">${escapeHtml(s)}</code>`).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <div class="detail-section">
                            <h3>Diff of Normalized Code</h3>
                            <pre class="diff-view">${data.diff.length > 0 ? data.diff.map(line => {
                                if (line.startsWith('+')) return `<span class="diff-add">${escapeHtml(line)}</span>`;
                                if (line.startsWith('-')) return `<span class="diff-remove">${escapeHtml(line)}</span>`;
                                return `<span class="diff-context">${escapeHtml(line)}</span>`;
                            }).join('\n') : 'No differences - code is identical after normalization.'}</pre>
                        </div>
                    </div>
                `;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error-msg">Error: ${error.message}. Is the server running?</div>`;
            }
        }

        function clearCompare() {
            document.getElementById('code1').value = '';
            document.getElementById('code2').value = '';
            document.getElementById('compare-results').innerHTML = '';
        }

        // Submit Code
        async function submitCode() {
            const code = document.getElementById('submit-code').value.trim();
            const tag = document.getElementById('submit-tag').value.trim();
            const student_id = document.getElementById('submit-student').value.trim();
            const filename = document.getElementById('submit-filename').value.trim();
            const resultsDiv = document.getElementById('submit-results');

            if (!code || !tag) {
                resultsDiv.innerHTML = '<div class="error-msg">Code and tag are required</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><span>Submitting...</span></div>';

            try {
                const response = await fetch(`${API_URL}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, tag, student_id, filename })
                });

                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error-msg">${data.error}</div>`;
                } else {
                    resultsDiv.innerHTML = `<div class="success-msg">✓ ${data.message} (ID: ${data.submission_id})</div>`;
                    document.getElementById('submit-code').value = '';
                }

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
            }
        }

        // Check Against Tag
        async function checkAgainstTag() {
            const code = document.getElementById('check-code').value.trim();
            const tag = document.getElementById('check-tag').value.trim();
            const student_id = document.getElementById('check-student').value.trim();
            const threshold = parseFloat(document.getElementById('check-threshold').value) / 100;
            const resultsDiv = document.getElementById('check-results');

            if (!code || !tag) {
                resultsDiv.innerHTML = '<div class="error-msg">Code and tag are required</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><span>Checking...</span></div>';

            try {
                const response = await fetch(`${API_URL}/api/check_against_tag`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, tag, student_id, threshold })
                });

                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error-msg">${data.error}</div>`;
                    return;
                }

                resultsDiv.innerHTML = `
                    <div class="results">
                        <div class="info-box">
                            <h4>Results for tag: ${data.tag}</h4>
                            <p>Compared against ${data.total_compared} submissions. Found ${data.flagged_count} matches above ${data.threshold}% threshold.</p>
                        </div>

                        ${data.matches.length > 0 ? `
                            <table class="match-table">
                                <thead>
                                    <tr>
                                        <th>Student ID</th>
                                        <th>Filename</th>
                                        <th>Similarity</th>
                                        <th>Verdict</th>
                                        <th>Submitted</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.matches.map(m => `
                                        <tr>
                                            <td>${escapeHtml(m.student_id)}</td>
                                            <td>${escapeHtml(m.filename)}</td>
                                            <td><span class="score-badge ${getBadgeClass(m.verdict.level)}">${m.score}%</span></td>
                                            <td>${m.verdict.text}</td>
                                            <td>${new Date(m.submitted_at).toLocaleString()}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : '<p style="color:#a1a1aa;padding:1rem;">No matches found above threshold.</p>'}
                    </div>
                `;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
            }
        }

        // Batch Analysis
        async function batchAnalysis() {
            const tag = document.getElementById('batch-tag').value.trim();
            const threshold = parseFloat(document.getElementById('batch-threshold').value) / 100;
            const resultsDiv = document.getElementById('batch-results');

            if (!tag) {
                resultsDiv.innerHTML = '<div class="error-msg">Tag is required</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><span>Analyzing all pairs...</span></div>';

            try {
                const response = await fetch(`${API_URL}/api/check_all_pairs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag, threshold })
                });

                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error-msg">${data.error}</div>`;
                    return;
                }

                resultsDiv.innerHTML = `
                    <div class="results">
                        <div class="info-box">
                            <h4>Batch Analysis for: ${data.tag}</h4>
                            <p>${data.total_submissions} submissions, ${data.total_pairs_checked} pairs checked.
                               <strong style="color: ${data.flagged_count > 0 ? '#f87171' : '#4ade80'}">
                                   ${data.flagged_count} flagged pairs
                               </strong> above ${data.threshold}% threshold.</p>
                        </div>

                        ${data.pairs.length > 0 ? `
                            <table class="match-table">
                                <thead>
                                    <tr>
                                        <th>Student 1</th>
                                        <th>Student 2</th>
                                        <th>Similarity</th>
                                        <th>Verdict</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.pairs.map(p => `
                                        <tr>
                                            <td>${escapeHtml(p.student1.id)}<br><small style="color:#a1a1aa">${escapeHtml(p.student1.filename)}</small></td>
                                            <td>${escapeHtml(p.student2.id)}<br><small style="color:#a1a1aa">${escapeHtml(p.student2.filename)}</small></td>
                                            <td><span class="score-badge ${getBadgeClass(p.verdict.level)}">${p.score}%</span></td>
                                            <td>${p.verdict.text}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : '<p style="color:#4ade80;padding:1rem;">✓ No suspicious pairs found!</p>'}
                    </div>
                `;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
            }
        }

        // Load Tags
        async function loadTags() {
            const container = document.getElementById('tags-container');

            try {
                const response = await fetch(`${API_URL}/api/tags`);
                const data = await response.json();

                if (data.tags.length === 0) {
                    container.innerHTML = '<p style="color:#a1a1aa;">No tags yet. Submit some code first!</p>';
                    return;
                }

                container.innerHTML = `
                    <div class="tags-list">
                        ${data.tags.map(t => `
                            <div class="tag-item" onclick="loadSubmissions('${t.tag}')">
                                <span>${escapeHtml(t.tag)}</span>
                                <span class="tag-count">${t.count}</span>
                            </div>
                        `).join('')}
                    </div>
                `;

            } catch (error) {
                container.innerHTML = `<div class="error-msg">Error loading tags: ${error.message}</div>`;
            }
        }

        // Load Submissions for a tag
        async function loadSubmissions(tag) {
            const container = document.getElementById('submissions-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading submissions...</span></div>';

            try {
                const response = await fetch(`${API_URL}/api/submissions/${tag}`);
                const data = await response.json();

                container.innerHTML = `
                    <div class="panel" style="margin-top: 1rem;">
                        <div class="panel-header">
                            <span class="panel-title">Submissions for: ${escapeHtml(data.tag)} (${data.count})</span>
                        </div>
                        <table class="match-table">
                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Filename</th>
                                    <th>Submitted</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.submissions.map(s => `
                                    <tr id="row-${s.id}">
                                        <td>${escapeHtml(s.student_id)}</td>
                                        <td>${escapeHtml(s.filename)}</td>
                                        <td>${new Date(s.submitted_at).toLocaleString()}</td>
                                        <td>
                                            <button class="secondary-btn" style="padding:0.25rem 0.5rem;font-size:0.8rem" onclick="deleteSubmission('${s.id}')">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

            } catch (error) {
                container.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
            }
        }

        // Delete submission
        async function deleteSubmission(id) {
            if (!confirm('Are you sure you want to delete this submission?')) return;

            try {
                const response = await fetch(`${API_URL}/api/submission/${id}`, { method: 'DELETE' });
                const data = await response.json();

                if (data.success) {
                    document.getElementById(`row-${id}`).remove();
                    loadTags();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
